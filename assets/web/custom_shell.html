<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#041420">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	--bg-abyss: #030e17;
	--bg-deep: #061d2e;
	--bg-reef: #0b3950;
	--paper: #f4f0dc;
	--cyan: #83ded9;
	--cyan-dim: rgba(131, 222, 217, 0.24);
	--amber: #edce7a;
	--amber-dim: rgba(237, 206, 122, 0.32);
	--muted: #abc9ce;
	--danger: #f28c77;
	--glass: rgba(5, 22, 35, 0.72);
}

*, *::before, *::after {
	box-sizing: border-box;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: var(--paper);
	background-color: var(--bg-abyss);
	overflow: hidden;
	touch-action: none;
	user-select: none;
	-webkit-user-select: none;
	font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", serif;
}

#canvas {
	display: block;
	background-color: var(--bg-abyss);
}

#canvas:focus {
	outline: none;
}

/* === Custom Abyssal Echo Loading Screen === */
#status {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
	padding: clamp(20px, 4vh, 44px) clamp(24px, 5vw, 72px);
	background:
		radial-gradient(110% 75% at 50% -8%, rgba(28, 134, 158, 0.42) 0%, rgba(11, 57, 80, 0.26) 42%, transparent 76%),
		radial-gradient(65% 55% at 72% 46%, rgba(18, 92, 114, 0.24) 0%, transparent 72%),
		linear-gradient(180deg, #07263a 0%, #051929 48%, #030d16 100%);
	overflow: hidden;
	opacity: 1;
	transition: opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1), transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}

#status.is-fading-out {
	opacity: 0;
	transform: scale(1.014);
	pointer-events: none;
}

#status-fx-canvas {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
	z-index: 0;
}

.caustic-veil {
	position: absolute;
	inset: -18% -10% 0 -10%;
	pointer-events: none;
	z-index: 1;
	background:
		conic-gradient(from 164deg at 46% -6%,
			transparent 0deg,
			rgba(131, 222, 217, 0.085) 8deg,
			transparent 18deg,
			rgba(244, 240, 220, 0.06) 27deg,
			transparent 38deg,
			rgba(131, 222, 217, 0.075) 48deg,
			transparent 62deg);
	filter: blur(22px);
	transform-origin: 48% 0%;
	animation: causticSway 11s ease-in-out infinite alternate;
}

.vignette-veil {
	position: absolute;
	inset: 0;
	pointer-events: none;
	z-index: 1;
	background: radial-gradient(circle at 50% 48%, transparent 46%, rgba(2, 9, 15, 0.68) 100%);
}

@keyframes causticSway {
	0% { transform: rotate(-3.5deg) scaleX(1.02); opacity: 0.78; }
	100% { transform: rotate(3.5deg) scaleX(1.08); opacity: 1; }
}

/* Top Telemetry Bar */
.expedition-topbar {
	position: relative;
	z-index: 3;
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 16px;
	animation: revealDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.journal-tag {
	display: flex;
	align-items: center;
	gap: 14px;
	font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
	font-size: 12px;
	letter-spacing: 0.28em;
	color: var(--muted);
	text-transform: uppercase;
}

.journal-tag::before {
	content: "";
	display: inline-block;
	width: 3px;
	height: 20px;
	background: var(--amber);
	box-shadow: 0 0 10px rgba(237, 206, 122, 0.45);
}

.depth-telemetry {
	text-align: right;
	font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}

.depth-telemetry-row {
	display: flex;
	align-items: baseline;
	justify-content: flex-end;
	gap: 8px;
}

.depth-caption {
	font-size: 11px;
	letter-spacing: 0.24em;
	color: var(--cyan);
}

.depth-number {
	font-size: clamp(20px, 2.4vw, 28px);
	font-weight: 500;
	letter-spacing: 0.06em;
	font-variant-numeric: tabular-nums;
	color: var(--paper);
	text-shadow: 0 0 18px rgba(131, 222, 217, 0.22);
}

.depth-biome {
	margin-top: 3px;
	font-size: 12px;
	letter-spacing: 0.14em;
	color: var(--muted);
}

/* Center Stage */
.expedition-stage {
	position: relative;
	z-index: 3;
	display: grid;
	grid-template-columns: minmax(280px, 520px) minmax(240px, 380px);
	align-items: center;
	justify-content: space-between;
	gap: clamp(24px, 5vw, 72px);
	width: min(1080px, 100%);
	margin: auto;
}

.title-column {
	display: flex;
	flex-direction: column;
	align-items: flex-start;
	animation: revealUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
}

.eyebrow-line {
	display: flex;
	align-items: center;
	gap: 14px;
	margin-bottom: 18px;
	font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
	font-size: 13px;
	letter-spacing: 0.32em;
	color: var(--paper);
	opacity: 0.92;
}

.eyebrow-line::before {
	content: "";
	width: 38px;
	height: 2px;
	background: var(--amber);
}

.hero-title {
	margin: 0;
	font-size: clamp(46px, 6.2vw, 76px);
	font-weight: 600;
	line-height: 1.08;
	letter-spacing: 0.06em;
	color: var(--paper);
	text-shadow:
		0 6px 28px rgba(3, 14, 23, 0.65),
		0 0 36px rgba(131, 222, 217, 0.14);
}

.hero-subtitle {
	margin: 12px 0 0 4px;
	font-family: "Cinzel", "Optima", "Palatino Linotype", "Book Antiqua", Georgia, serif;
	font-size: clamp(13px, 1.45vw, 18px);
	font-weight: 500;
	letter-spacing: 0.42em;
	color: var(--cyan);
	text-transform: uppercase;
}

.hero-divider {
	width: 52px;
	height: 1px;
	margin: 26px 0 22px 4px;
	background: linear-gradient(90deg, var(--amber), rgba(237, 206, 122, 0.08));
}

.hero-lead {
	margin: 0 0 10px 4px;
	font-size: clamp(18px, 2vw, 24px);
	font-weight: 400;
	letter-spacing: 0.08em;
	color: var(--paper);
}

.hero-tip {
	margin: 0 0 0 4px;
	max-width: 460px;
	min-height: 46px;
	font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
	font-size: 14px;
	line-height: 1.7;
	letter-spacing: 0.04em;
	color: var(--muted);
	transition: opacity 0.35s ease;
}

/* Sunken Observatory Astrolabe */
.astrolabe-column {
	display: flex;
	align-items: center;
	justify-content: center;
	animation: revealScale 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
}

.astrolabe-wrap {
	position: relative;
	width: clamp(220px, 28vw, 340px);
	aspect-ratio: 1 / 1;
	display: grid;
	place-items: center;
}

.astrolabe-glow {
	position: absolute;
	inset: 14%;
	border-radius: 50%;
	background: radial-gradient(circle, rgba(22, 107, 120, 0.42) 0%, rgba(131, 222, 217, 0.08) 54%, transparent 74%);
	filter: blur(12px);
	animation: pulseGlow 4.2s ease-in-out infinite;
}

.astrolabe-svg {
	position: relative;
	width: 100%;
	height: 100%;
	overflow: visible;
}

.ring-spin-slow {
	transform-origin: 160px 160px;
	animation: spinClockwise 48s linear infinite;
}

.ring-spin-reverse {
	transform-origin: 160px 160px;
	animation: spinCounter 34s linear infinite;
}

.sonar-sweep-group {
	transform-origin: 160px 160px;
	animation: spinClockwise 5.4s linear infinite;
}

.sonar-ripple {
	transform-origin: 160px 160px;
	animation: sonarPulse 3.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}

.sonar-ripple--delay {
	animation-delay: 1.8s;
}

.diver-emblem {
	transform-origin: 145px 146px;
	animation: diverGlide 4.5s ease-in-out infinite;
}

#astrolabe-progress-arc {
	transform: rotate(-90deg);
	transform-origin: 160px 160px;
	transition: stroke-dashoffset 0.22s ease-out;
	filter: drop-shadow(0 0 6px rgba(131, 222, 217, 0.55));
}

@keyframes spinClockwise {
	from { transform: rotate(0deg); }
	to { transform: rotate(360deg); }
}

@keyframes spinCounter {
	from { transform: rotate(360deg); }
	to { transform: rotate(0deg); }
}

@keyframes sonarPulse {
	0% { transform: scale(0.28); opacity: 0.65; }
	100% { transform: scale(1.06); opacity: 0; }
}

@keyframes diverGlide {
	0%, 100% { transform: translateY(-2.5px) rotate(-2deg); }
	50% { transform: translateY(3px) rotate(2.2deg); }
}

@keyframes pulseGlow {
	0%, 100% { opacity: 0.72; transform: scale(0.97); }
	50% { opacity: 1; transform: scale(1.04); }
}

/* Bottom Progress Instrument */
.expedition-footer {
	position: relative;
	z-index: 3;
	width: min(1080px, 100%);
	margin: 0 auto;
	font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
	animation: revealUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
}

.progress-header {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 16px;
	margin-bottom: 10px;
}

.phase-status {
	display: flex;
	align-items: center;
	gap: 10px;
	font-size: 13px;
	letter-spacing: 0.08em;
	color: var(--paper);
}

.phase-dot {
	width: 7px;
	height: 7px;
	border-radius: 50%;
	background: var(--amber);
	box-shadow: 0 0 10px var(--amber);
	animation: beaconBlink 1.6s ease-in-out infinite;
}

@keyframes beaconBlink {
	0%, 100% { opacity: 0.55; transform: scale(0.88); }
	50% { opacity: 1; transform: scale(1.18); }
}

.progress-metrics {
	display: flex;
	align-items: baseline;
	gap: 14px;
	font-variant-numeric: tabular-nums;
}

.transfer-detail {
	font-size: 12px;
	letter-spacing: 0.06em;
	color: var(--muted);
}

.percent-readout {
	font-size: 20px;
	font-weight: 600;
	letter-spacing: 0.06em;
	color: var(--amber);
	text-shadow: 0 0 14px rgba(237, 206, 122, 0.32);
}

.horizon-track {
	position: relative;
	height: 6px;
	width: 100%;
	border-radius: 999px;
	background: rgba(131, 222, 217, 0.12);
	border: 1px solid rgba(131, 222, 217, 0.2);
	overflow: visible;
}

.horizon-fill {
	position: relative;
	height: 100%;
	width: 0%;
	border-radius: 999px;
	background: linear-gradient(90deg, #2b9aaa 0%, var(--cyan) 62%, var(--amber) 100%);
	box-shadow: 0 0 16px rgba(131, 222, 217, 0.42);
	transition: width 0.16s ease-out;
}

.horizon-fill::after {
	content: "";
	position: absolute;
	right: -5px;
	top: 50%;
	width: 11px;
	height: 11px;
	border-radius: 50%;
	transform: translateY(-50%);
	background: var(--paper);
	border: 2px solid var(--amber);
	box-shadow: 0 0 14px rgba(237, 206, 122, 0.9);
}

.horizon-ruler {
	display: flex;
	justify-content: space-between;
	margin-top: 9px;
	font-size: 11px;
	letter-spacing: 0.14em;
	color: rgba(171, 201, 206, 0.68);
	font-variant-numeric: tabular-nums;
}

.horizon-ruler span {
	position: relative;
	padding-top: 4px;
}

.horizon-ruler span::before {
	content: "";
	position: absolute;
	top: -5px;
	left: 50%;
	width: 1px;
	height: 4px;
	background: rgba(131, 222, 217, 0.28);
}

/* Error Notice Overlay */
#status-notice {
	display: none;
	position: relative;
	z-index: 5;
	max-width: 560px;
	margin: 18px auto 0;
	padding: 18px 24px;
	background: rgba(12, 24, 34, 0.92);
	border: 1px solid rgba(242, 140, 119, 0.65);
	border-left: 3px solid var(--danger);
	border-radius: 4px;
	color: var(--paper);
	font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
	font-size: 13px;
	line-height: 1.65;
	box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
}

@keyframes revealUp {
	from { opacity: 0; transform: translateY(14px); }
	to { opacity: 1; transform: translateY(0); }
}

@keyframes revealDown {
	from { opacity: 0; transform: translateY(-10px); }
	to { opacity: 1; transform: translateY(0); }
}

@keyframes revealScale {
	from { opacity: 0; transform: scale(0.93); }
	to { opacity: 1; transform: scale(1); }
}

@media (max-width: 820px) {
	.expedition-stage {
		grid-template-columns: 1fr;
		text-align: center;
		justify-items: center;
		gap: 18px;
	}
	.title-column {
		align-items: center;
		order: 2;
	}
	.astrolabe-column {
		order: 1;
	}
	.astrolabe-wrap {
		width: clamp(168px, 38vw, 230px);
	}
	.hero-divider, .hero-lead, .hero-tip, .hero-subtitle {
		margin-left: 0;
	}
	.transfer-detail {
		display: none;
	}
}

			</footer>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const progressPanel = document.getElementById('status-progress-panel');
	const barFill = document.getElementById('status-bar-fill');
	const percentEl = document.getElementById('status-percent');
	const phaseTextEl = document.getElementById('status-phase-text');
	const transferEl = document.getElementById('status-transfer');
	const depthEl = document.getElementById('status-depth');
	const biomeEl = document.getElementById('status-biome');
	const tipEl = document.getElementById('status-tip');
	const arcEl = document.getElementById('astrolabe-progress-arc');
	const fxCanvas = document.getElementById('status-fx-canvas');
	const ARC_CIRCUMFERENCE = 829.38;

	const BIOME_STAGES = [
		{ at: 0.00, biome: '阳光浅礁带 · 逃生舱锚地' },
		{ at: 0.18, biome: '琉璃珊瑚礁花园 · 生态礁盘' },
		{ at: 0.36, biome: '翡翠巨藻迷宫海峡 · 洋流航道' },
		{ at: 0.54, biome: '暮光大断崖 · 大陆坡裂谷' },
		{ at: 0.72, biome: '东海沉没星象古都 · 观测神殿' },
		{ at: 0.88, biome: '远古深海母树 · 极渊核心' },
		{ at: 0.96, biome: '南极渊星辉圣域 · 潜航就绪' },
	];

	const EXPEDITION_TIPS = [
		'穿行于摇曳的海底森林与沉没古都之间，用声呐倾听九片海域的回响。',
		'释放 N 键声呐勘测脉冲，可在幽暗海沟中勾勒地形轮廓与远古遗迹。',
		'收集钛矿、石英与海藻样本，升级循环呼吸器以从容下潜百米深渊。',
		'使用蓝光静滞枪平息深海巨兽，靠近即可缔结契约并肩巡游外洋。',
	];

	let initializing = true;
	let fxAnimId = 0;
	let uiAnimId = 0;
	let tipTimer = 0;
	let tipIndex = 0;
	let targetRatio = 0.02;
	let displayRatio = 0.0;
	let customPhaseLabel = '';
	let lastTransferText = '';
	const bootStartTime = performance.now();

	// Ambient marine snow & rising bubble simulation on lightweight 2D canvas
	function startOceanParticles() {
		if (!fxCanvas) return;
		const ctx = fxCanvas.getContext('2d');
		if (!ctx) return;
		let width = 0;
		let height = 0;
		const particles = [];

		function resize() {
			const dpr = Math.min(window.devicePixelRatio || 1, 2);
			width = window.innerWidth;
			height = window.innerHeight;
			fxCanvas.width = Math.max(1, Math.floor(width * dpr));
			fxCanvas.height = Math.max(1, Math.floor(height * dpr));
			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		}
		resize();
		window.addEventListener('resize', resize);

		const count = Math.min(68, Math.max(32, Math.floor((window.innerWidth * window.innerHeight) / 24000)));
		for (let i = 0; i < count; i++) {
			const isGold = i % 7 === 0;
			const isBubble = i % 4 === 0;
			particles.push({
				x: Math.random() * (width || 1280),
				y: Math.random() * (height || 800),
				r: isBubble ? 1.6 + Math.random() * 2.6 : 0.8 + Math.random() * 1.7,
				vy: isBubble ? -(14 + Math.random() * 24) : -(5 + Math.random() * 11),
				vx: (Math.random() - 0.5) * 8,
				phase: Math.random() * Math.PI * 2,
				alpha: isGold ? 0.45 + Math.random() * 0.35 : 0.16 + Math.random() * 0.36,
				isGold,
				isBubble,
			});
		}

		let prev = performance.now();
		function renderFx(now) {
			if (!initializing) {
				window.removeEventListener('resize', resize);
				return;
			}
			const dt = Math.min(0.05, (now - prev) / 1000);
			prev = now;
			ctx.clearRect(0, 0, width, height);

			for (let i = 0; i < particles.length; i++) {
				const p = particles[i];
				p.y += p.vy * dt;
				p.x += (p.vx + Math.sin(now * 0.0012 + p.phase) * 7) * dt;
				if (p.y < -12) {
					p.y = height + 12;
					p.x = Math.random() * width;
				}
				if (p.x < -12) p.x = width + 12;
				if (p.x > width + 12) p.x = -12;

				const twinkle = 0.72 + 0.28 * Math.sin(now * 0.0026 + p.phase);
				ctx.beginPath();
				ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
				if (p.isBubble) {
					ctx.strokeStyle = 'rgba(131, 222, 217, ' + (p.alpha * twinkle).toFixed(3) + ')';
					ctx.lineWidth = 1;
					ctx.stroke();
				} else if (p.isGold) {
					ctx.fillStyle = 'rgba(237, 206, 122, ' + (p.alpha * twinkle).toFixed(3) + ')';
					ctx.fill();
				} else {
					ctx.fillStyle = 'rgba(216, 243, 240, ' + (p.alpha * twinkle).toFixed(3) + ')';
					ctx.fill();
				}
			}
			fxAnimId = requestAnimationFrame(renderFx);
		}
		fxAnimId = requestAnimationFrame(renderFx);
	}

	function formatMB(bytes) {
		return (bytes / 1048576).toFixed(1);
	}

	function applyProgressVisuals(ratio) {
		const clamped = Math.max(0, Math.min(1, ratio));
		const pct = Math.round(clamped * 100);
		barFill.style.width = (clamped * 100).toFixed(2) + '%';
		percentEl.textContent = pct + '%';
		statusOverlay.setAttribute('aria-valuenow', String(pct));
		if (arcEl) {
			arcEl.style.strokeDashoffset = (ARC_CIRCUMFERENCE * (1 - clamped)).toFixed(2);
		}
		const meters = Math.round(clamped * 600);
		depthEl.textContent = String(meters).padStart(3, '0') + ' m';

		let activeBiome = BIOME_STAGES[0].biome;
		for (let i = 0; i < BIOME_STAGES.length; i++) {
			if (clamped >= BIOME_STAGES[i].at) {
				activeBiome = BIOME_STAGES[i].biome;
			}
		}
		biomeEl.textContent = activeBiome;

		if (customPhaseLabel) {
			phaseTextEl.textContent = customPhaseLabel;
		} else if (clamped < 0.36) {
			phaseTextEl.textContent = '正在唤醒深海引擎核心 (WASM)...';
		} else if (clamped < 0.86) {
			phaseTextEl.textContent = '正在载入九片海域生态与船坞档案...';
		} else if (clamped < 0.99) {
			phaseTextEl.textContent = '正在构筑珊瑚浅礁与深海光影...';
		} else {
			phaseTextEl.textContent = '航道已就绪 · 即将潜入深海';
		}

		if (lastTransferText) {
			transferEl.textContent = lastTransferText;
		}
	}

	function tickProgressLoop() {
		if (!initializing) return;
		const diff = targetRatio - displayRatio;
		if (Math.abs(diff) > 0.0005) {
			displayRatio += diff * 0.16;
		} else {
			displayRatio = targetRatio;
		}
		applyProgressVisuals(displayRatio);
		uiAnimId = requestAnimationFrame(tickProgressLoop);
	}

	// Hook into chunked stream progress emitted by build_web.mjs fetch shim
	window.addEventListener('abyssal-load-progress', function (ev) {
		if (!initializing || !ev.detail) return;
		const d = ev.detail;
		if (d.totalBytes > 0) {
			const dlRatio = Math.min(1, d.loadedBytes / d.totalBytes);
			// Network download accounts for 0% -> 88% of total startup
			targetRatio = Math.max(targetRatio, 0.03 + dlRatio * 0.85);
			const elapsedSec = Math.max(0.2, (performance.now() - bootStartTime) / 1000);
			const speedMB = (d.loadedBytes / 1048576) / elapsedSec;
			lastTransferText = formatMB(d.loadedBytes) + ' / ' + formatMB(d.totalBytes) + ' MB · ' + speedMB.toFixed(1) + ' MB/s';
		}
	});

	// Bridge called by scripts/loading_screen.gd while constructing the 3D ocean scene
	window.__abyssalSetEngineStage = function (ratio, label) {
		if (!initializing) return;
		if (typeof ratio === 'number') {
			targetRatio = Math.max(targetRatio, Math.min(1, ratio));
		}
		if (label) {
			customPhaseLabel = String(label);
		}
	};

	function dismissLoadingOverlay(immediate) {
		if (!initializing) return;
		initializing = false;
		if (tipTimer) clearInterval(tipTimer);
		if (uiAnimId) cancelAnimationFrame(uiAnimId);
		if (fxAnimId) cancelAnimationFrame(fxAnimId);
		applyProgressVisuals(1);

		const finalizeRemoval = function () {
			if (statusOverlay && statusOverlay.parentNode) {
				statusOverlay.remove();
			}
			const canvas = document.getElementById('canvas');
			if (canvas && GODOT_CONFIG.focusCanvas) {
				canvas.focus();
			}
		};

		if (immediate) {
			finalizeRemoval();
		} else {
			statusOverlay.classList.add('is-fading-out');
			setTimeout(finalizeRemoval, 280);
		}
	}

	window.__abyssalFinishLoading = function () {
		dismissLoadingOverlay(false);
	};

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = String(text).split('\n');
		lines.forEach(function (line, index) {
			statusNotice.appendChild(document.createTextNode(line));
			if (index < lines.length - 1) {
				statusNotice.appendChild(document.createElement('br'));
			}
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		initializing = false;
		if (tipTimer) clearInterval(tipTimer);
		if (uiAnimId) cancelAnimationFrame(uiAnimId);
		if (fxAnimId) cancelAnimationFrame(fxAnimId);
		if (progressPanel) progressPanel.style.display = 'none';
		if (err instanceof Error) {
			setStatusNotice('潜航终端启动异常：\n' + err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('发生未知启动错误，请刷新页面重试。');
		}
		statusNotice.style.display = 'block';
	}

	startOceanParticles();
	uiAnimId = requestAnimationFrame(tickProgressLoop);
	tipTimer = setInterval(function () {
		if (!initializing || !tipEl) return;
		tipEl.style.opacity = '0';
		setTimeout(function () {
			if (!tipEl) return;
			tipIndex = (tipIndex + 1) % EXPEDITION_TIPS.length;
			tipEl.textContent = EXPEDITION_TIPS[tipIndex];
			tipEl.style.opacity = '1';
		}, 320);
	}, 4200);

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then(function (registration) {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(function () { return engine.installServiceWorker(); }),
				new Promise(function (resolve) {
					setTimeout(function () { resolve(); }, 2000);
				}),
			]).then(function () {
				window.location.reload();
			}).catch(function (err) {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = '当前浏览器缺少运行《深蓝回声》Web 版所需的底层特性：\n' + missing.join('\n');
			displayFailureNotice(missingMsg);
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const rawRatio = Math.min(1, current / total);
					targetRatio = Math.max(targetRatio, 0.03 + rawRatio * 0.85);
					if (!lastTransferText) {
						lastTransferText = formatMB(current) + ' / ' + formatMB(total) + ' MB';
					}
				}
			},
		}).then(function () {
			// Probe builds (window.artReview) remove overlay immediately without fading
			if (window.artReview) {
				dismissLoadingOverlay(true);
				return;
			}
			if (window.__abyssalGameReady) {
				dismissLoadingOverlay(false);
				return;
			}
			targetRatio = Math.max(targetRatio, 0.90);
			customPhaseLabel = '正在构筑珊瑚浅礁与深海光影...';
			const waitStart = performance.now();
			function waitSceneReady() {
				if (!initializing) return;
				if (window.artReview) {
					dismissLoadingOverlay(true);
					return;
				}
				if (window.__abyssalGameReady || (performance.now() - waitStart) > 2200) {
					dismissLoadingOverlay(false);
					return;
				}
				requestAnimationFrame(waitSceneReady);
			}
			requestAnimationFrame(waitSceneReady);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
